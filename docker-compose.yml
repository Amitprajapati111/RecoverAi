version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: recoverai_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - recoverai_net

  redis:
    image: redis:7.2-alpine
    container_name: recoverai_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - recoverai_net

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: recoverai_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/recoverai
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=recoverai_production_secret_key_change_me
      - JWT_REFRESH_SECRET=recoverai_production_refresh_key_change_me
      - RAZORPAY_ENV=test
      - AI_PROVIDER=mock
      - FRONTEND_URL=http://localhost:3000
    depends_on:
      - mongodb
      - redis
    networks:
      - recoverai_net

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: recoverai_worker
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/recoverai
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=recoverai_production_secret_key_change_me
      - AI_PROVIDER=mock
    depends_on:
      - mongodb
      - redis
    networks:
      - recoverai_net

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: recoverai_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - recoverai_net

networks:
  recoverai_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
